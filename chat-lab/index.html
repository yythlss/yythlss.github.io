<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f0e8">
  <title>下载 kosmoX Chat</title>
  <style>
    :root { color-scheme: light; --paper:#f4f0e8; --ink:#1b181f; --muted:#56515d; --violet:#5a00bd; --lavender:#e9e0f5; --line:#1b181f42; }
    * { box-sizing: border-box; }
    html, body { min-width: 320px; min-height: 100%; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
      color: var(--ink);
      background-color: var(--paper);
      background-image: linear-gradient(#1b181f14 1px,transparent 1px),linear-gradient(90deg,#1b181f14 1px,transparent 1px);
      background-size: 28px 28px;
      font-family: Inter,"Noto Sans SC","Microsoft YaHei",Arial,sans-serif;
    }
    main { width: min(100%, 620px); border: 1px solid var(--ink); background: #fbf8f1; box-shadow: 8px 8px 0 #5a00bd26; }
    header { padding: 14px 18px; display: flex; align-items: center; gap: 10px; color: #fff; background: var(--violet); }
    .mark { width: 11px; height: 11px; background: #fff; }
    header span { font: 700 11px/1.2 "Cascadia Code",Consolas,monospace; text-transform: uppercase; }
    .content { padding: clamp(28px,7vw,54px); }
    .eyebrow { margin: 0 0 12px; color: var(--violet); font: 700 11px/1.3 "Cascadia Code",Consolas,monospace; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(30px,8vw,52px); font-weight: 900; line-height: 1; letter-spacing: -.045em; }
    p { margin: 18px 0 0; color: var(--muted); line-height: 1.75; }
    .status { margin-top: 26px; padding: 12px 14px; border-left: 4px solid var(--violet); background: var(--lavender); font-size: 13px; }
    a {
      width: 100%;
      min-height: 52px;
      margin-top: 22px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      color: #fff;
      border: 1px solid #43008f;
      background: var(--violet);
      font: 700 12px/1 "Cascadia Code",Consolas,monospace;
      text-decoration: none;
      text-transform: uppercase;
    }
    a:hover { background: #43008f; }
    small { display: block; margin-top: 14px; color: var(--muted); text-align: center; font-size: 11px; }
    @media (max-width:480px) { main { box-shadow: 5px 5px 0 #5a00bd26; } .content { padding: 30px 22px; } }
  </style>
</head>
<body>
  <main>
    <header><span class="mark"></span><span>kosmoX / Chat Lab</span></header>
    <div class="content">
      <p class="eyebrow">Local HTML // Download</p>
      <h1>正在下载<br>本地对话页面</h1>
      <p>下载完成后，直接双击 HTML 文件即可开始对话，无需安装任何软件。</p>
      <div id="status" class="status" role="status">正在准备下载…</div>
      <a id="download" href="./kosmoX-chat.html" download="kosmoX-chat.html">下载 HTML 文件</a>
      <small>如果浏览器没有自动下载，请点击上方按钮。</small>
    </div>
  </main>
  <script>
    (() => {
      const button = document.getElementById('download');
      const status = document.getElementById('status');
      let started = false;
      const startDownload = () => {
        if (started) return;
        started = true;
        button.click();
        status.textContent = '下载已开始，请查看浏览器的下载记录。';
      };
      window.addEventListener('load', () => setTimeout(startDownload, 350), { once: true });
      button.addEventListener('click', () => {
        started = true;
        status.textContent = '下载已开始，请查看浏览器的下载记录。';
      });
    })();
  </script>
</body>
</html>
