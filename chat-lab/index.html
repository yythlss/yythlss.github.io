<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f4f0e8">
  <title>kosmoX Chat Lab · API 对话</title>
  <style>
    :root {
      --bg: #080b12;
      --panel: rgba(18, 23, 35, 0.86);
      --panel-solid: #121723;
      --panel-soft: #171d2a;
      --line: rgba(255, 255, 255, 0.09);
      --line-strong: rgba(255, 255, 255, 0.15);
      --text: #edf2ff;
      --muted: #8f9ab2;
      --accent: #7c6cff;
      --accent-2: #a58cff;
      --success: #57d6a6;
      --danger: #ff758b;
      --warning: #f2c46d;
      --shadow: 0 24px 80px rgba(0, 0, 0, 0.42);
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(circle at 12% 5%, rgba(124, 108, 255, 0.18), transparent 30rem),
        radial-gradient(circle at 88% 100%, rgba(58, 204, 166, 0.09), transparent 34rem),
        var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", "Microsoft YaHei", sans-serif;
      overflow: hidden;
    }

    button, input, select, textarea { font: inherit; }
    button { color: inherit; }

    .app {
      width: min(1500px, 100%);
      height: 100dvh;
      margin: 0 auto;
      padding: 18px;
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
      gap: 16px;
    }

    .sidebar,
    .chat-shell {
      background: var(--panel);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .sidebar {
      min-height: 0;
      border-radius: var(--radius);
      padding: 22px;
      display: flex;
      flex-direction: column;
      overflow: auto;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 26px;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, var(--accent), #4f42c8);
      box-shadow: 0 10px 28px rgba(124, 108, 255, 0.34);
    }

    .brand-mark svg { width: 23px; height: 23px; }
    .brand h1 { margin: 0; font-size: 18px; letter-spacing: 0.02em; }
    .brand p { margin: 3px 0 0; color: var(--muted); font-size: 12px; }

    .section-title {
      margin: 0 0 12px;
      color: #cbd3e6;
      font-size: 11px;
      font-weight: 750;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .field { margin-bottom: 16px; }

    .field label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      color: #b8c1d6;
      font-size: 12px;
      font-weight: 650;
    }

    .input-wrap { position: relative; }

    input, select, textarea {
      width: 100%;
      color: var(--text);
      background: rgba(7, 10, 17, 0.64);
      border: 1px solid var(--line-strong);
      border-radius: 11px;
      outline: none;
      transition: border-color 160ms ease, box-shadow 160ms ease, background 160ms ease;
    }

    input, select { height: 43px; padding: 0 12px; }
    input::placeholder, textarea::placeholder { color: #69748b; }

    input:focus, select:focus, textarea:focus {
      border-color: rgba(124, 108, 255, 0.85);
      box-shadow: 0 0 0 3px rgba(124, 108, 255, 0.14);
      background: rgba(7, 10, 17, 0.9);
    }

    select { cursor: pointer; }

    .with-icon { padding-right: 42px; }

    .icon-btn {
      width: 36px;
      height: 36px;
      padding: 0;
      display: inline-grid;
      place-items: center;
      border: 0;
      border-radius: 9px;
      background: transparent;
      cursor: pointer;
      transition: background 160ms ease, color 160ms ease, transform 160ms ease;
    }

    .icon-btn:hover { background: rgba(255, 255, 255, 0.07); }
    .icon-btn:active { transform: scale(0.95); }
    .icon-btn svg { width: 18px; height: 18px; }

    .input-action {
      position: absolute;
      right: 4px;
      top: 4px;
      color: var(--muted);
    }

    .remember-row {
      margin-top: -3px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
      cursor: pointer;
      user-select: none;
    }

    .remember-row input {
      width: 15px;
      height: 15px;
      margin: 0;
      accent-color: var(--accent);
    }

    .divider { height: 1px; margin: 22px 0; background: var(--line); }

    .status-card {
      margin-top: auto;
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.025);
    }

    .status-line { display: flex; align-items: center; gap: 8px; font-size: 12px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); box-shadow: 0 0 12px rgba(87, 214, 166, 0.7); }
    .status-card p { margin: 8px 0 0; color: var(--muted); font-size: 11px; line-height: 1.55; }

    .chat-shell {
      min-width: 0;
      min-height: 0;
      border-radius: var(--radius);
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      overflow: hidden;
    }

    .topbar {
      min-height: 72px;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      border-bottom: 1px solid var(--line);
    }

    .topbar-title { min-width: 0; }
    .topbar-title h2 { margin: 0; font-size: 15px; font-weight: 720; }
    .topbar-title p { margin: 5px 0 0; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .clear-btn {
      flex: 0 0 auto;
      height: 38px;
      padding: 0 13px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: #c7cfdf;
      border: 1px solid var(--line-strong);
      border-radius: 10px;
      background: transparent;
      cursor: pointer;
      transition: color 160ms ease, border-color 160ms ease, background 160ms ease;
    }

    .clear-btn:hover { color: var(--danger); border-color: rgba(255, 117, 139, 0.38); background: rgba(255, 117, 139, 0.08); }
    .clear-btn svg { width: 16px; height: 16px; }

    .messages {
      min-height: 0;
      overflow-y: auto;
      scroll-behavior: smooth;
      padding: 28px clamp(18px, 4vw, 64px);
    }

    .messages::-webkit-scrollbar, .sidebar::-webkit-scrollbar { width: 8px; }
    .messages::-webkit-scrollbar-thumb, .sidebar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 99px; }

    .empty-state {
      min-height: 100%;
      display: grid;
      place-items: center;
      text-align: center;
      color: var(--muted);
    }

    .empty-inner { max-width: 420px; }
    .empty-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 18px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(124, 108, 255, 0.35);
      border-radius: 20px;
      color: var(--accent-2);
      background: rgba(124, 108, 255, 0.1);
    }
    .empty-icon svg { width: 29px; height: 29px; }
    .empty-state h3 { margin: 0 0 9px; color: #dce3f2; font-size: 20px; }
    .empty-state p { margin: 0; line-height: 1.7; font-size: 13px; }

    .message-row {
      width: 100%;
      margin-bottom: 22px;
      display: flex;
      gap: 11px;
      align-items: flex-start;
      animation: rise 220ms ease both;
    }

    .message-row.user { flex-direction: row-reverse; }

    @keyframes rise {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .avatar {
      flex: 0 0 auto;
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: #c7cfe0;
      background: var(--panel-soft);
      font-size: 11px;
      font-weight: 760;
    }

    .user .avatar { border-color: transparent; background: linear-gradient(145deg, var(--accent), #574acb); color: white; }

    .message-stack { max-width: min(78%, 820px); min-width: 0; }
    .user .message-stack { display: flex; flex-direction: column; align-items: flex-end; }

    .bubble {
      width: fit-content;
      max-width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 6px 15px 15px 15px;
      color: #dfe6f5;
      background: rgba(24, 30, 44, 0.82);
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    .user .bubble {
      border-color: rgba(124, 108, 255, 0.24);
      border-radius: 15px 6px 15px 15px;
      color: #f5f3ff;
      background: rgba(91, 77, 207, 0.33);
    }

    .message-text { margin: 0; white-space: pre-wrap; }
    .message-images { display: grid; grid-template-columns: repeat(2, minmax(0, 260px)); gap: 8px; margin-bottom: 10px; }
    .message-images:empty { display: none; }
    .message-images img { width: 100%; max-height: 280px; display: block; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); cursor: zoom-in; }

    .message-meta { margin-top: 6px; padding: 0 3px; color: #707b91; font-size: 10px; }

    .typing { display: inline-flex; gap: 5px; padding: 6px 2px; }
    .typing span { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: bounce 1.1s infinite; }
    .typing span:nth-child(2) { animation-delay: 0.15s; }
    .typing span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes bounce { 0%, 70%, 100% { transform: translateY(0); opacity: 0.45; } 35% { transform: translateY(-4px); opacity: 1; } }

    .composer-area {
      padding: 14px clamp(14px, 3vw, 36px) 18px;
      border-top: 1px solid var(--line);
      background: rgba(11, 14, 22, 0.72);
    }

    .image-preview-list {
      display: flex;
      gap: 9px;
      overflow-x: auto;
      max-height: 96px;
      margin-bottom: 10px;
    }

    .image-preview-list:empty { display: none; margin: 0; }
    .preview-item { position: relative; flex: 0 0 auto; width: 82px; height: 82px; }
    .preview-item img { width: 100%; height: 100%; object-fit: cover; border: 1px solid var(--line-strong); border-radius: 11px; }
    .remove-image { position: absolute; top: -5px; right: -5px; width: 23px; height: 23px; border: 1px solid rgba(255,255,255,.15); border-radius: 50%; color: white; background: #272d3b; cursor: pointer; line-height: 1; }

    .composer {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 8px;
      align-items: end;
      padding: 7px;
      border: 1px solid var(--line-strong);
      border-radius: 15px;
      background: rgba(7, 10, 17, 0.74);
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }

    .composer:focus-within { border-color: rgba(124, 108, 255, 0.65); box-shadow: 0 0 0 3px rgba(124, 108, 255, 0.1); }

    .upload-btn { width: 42px; height: 42px; color: var(--muted); }
    .upload-btn:hover { color: var(--text); }

    textarea {
      min-height: 42px;
      max-height: 160px;
      padding: 10px 5px 8px;
      resize: none;
      border: 0;
      border-radius: 0;
      background: transparent;
      line-height: 1.5;
    }
    textarea:focus { box-shadow: none; background: transparent; }

    .send-btn {
      min-width: 82px;
      height: 42px;
      padding: 0 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      border: 0;
      border-radius: 11px;
      color: white;
      background: linear-gradient(135deg, var(--accent), #6353e4);
      box-shadow: 0 8px 22px rgba(124, 108, 255, 0.24);
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      transition: transform 160ms ease, filter 160ms ease, opacity 160ms ease;
    }
    .send-btn:hover { filter: brightness(1.09); }
    .send-btn:active { transform: scale(0.97); }
    .send-btn:disabled { cursor: not-allowed; opacity: 0.55; box-shadow: none; }
    .send-btn svg { width: 16px; height: 16px; }

    .composer-hint {
      min-height: 17px;
      margin: 7px 5px 0;
      display: flex;
      justify-content: space-between;
      gap: 16px;
      color: #677289;
      font-size: 10px;
    }

    .composer-hint .error { color: var(--danger); }
    .composer-hint .ok { color: var(--success); }
    .mobile-config { display: none; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      z-index: 20;
      max-width: min(92vw, 540px);
      padding: 11px 15px;
      border: 1px solid var(--line-strong);
      border-radius: 11px;
      color: #e7ebf6;
      background: #202635;
      box-shadow: 0 16px 42px rgba(0,0,0,.4);
      font-size: 12px;
      transform: translate(-50%, 20px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease, transform 180ms ease;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 820px) {
      body { overflow: auto; }
      .app { min-height: 100dvh; height: auto; padding: 0; display: block; }
      .sidebar { display: none; }
      .chat-shell { height: 100dvh; border: 0; border-radius: 0; }
      .mobile-config { display: inline-grid; }
      .topbar { min-height: 64px; padding: 11px 13px; }
      .topbar-actions { display: flex; gap: 5px; }
      .messages { padding: 22px 13px; }
      .message-stack { max-width: 87%; }
      .composer-area { padding: 10px 10px 12px; }
      .send-btn { min-width: 44px; width: 44px; padding: 0; }
      .send-btn span { display: none; }
      .composer-hint span:last-child { display: none; }
    }

    dialog {
      width: min(92vw, 440px);
      padding: 0;
      color: var(--text);
      border: 1px solid var(--line-strong);
      border-radius: 16px;
      background: #121722;
      box-shadow: var(--shadow);
    }
    dialog::backdrop { background: rgba(2, 4, 8, 0.72); backdrop-filter: blur(4px); }
    .dialog-head { padding: 18px 18px 12px; display: flex; justify-content: space-between; align-items: center; }
    .dialog-head h3 { margin: 0; font-size: 16px; }
    .dialog-body { padding: 8px 18px 20px; }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 9px; margin-top: 20px; }
    .secondary-btn { height: 39px; padding: 0 14px; border: 1px solid var(--line-strong); border-radius: 10px; background: transparent; cursor: pointer; }
    .primary-btn { height: 39px; padding: 0 14px; border: 0; border-radius: 10px; background: var(--accent); cursor: pointer; font-weight: 700; }
  </style>

    /* Tablet: retain the configuration rail, but make it more compact. */

    /* Very narrow phones */

<body>
  <main class="app">
    <aside class="sidebar" aria-label="接口配置">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 9.5a4 4 0 1 1 4 4H7l-3 3v-3.7A4 4 0 0 1 8 9.5Z"/><path d="M12 7.5h4a4 4 0 0 1 4 4v3.7l-3-3h-1"/></svg>
        </div>
        <div><h1>kosmoX / CHAT</h1><p>深研 Studio · 本地对话终端</p></div>
      </div>

      <p class="section-title">API Configuration</p>
      <div class="field">
        <label for="baseUrl">接口地址 <span>Base URL</span></label>
        <input id="baseUrl" type="url" value="http://119.45.250.189/v1" placeholder="https://api.example.com/v1" autocomplete="url">
      </div>

      <div class="field">
        <label for="apiKey">API Key <span>必填</span></label>
        <div class="input-wrap">
          <input id="apiKey" class="with-icon" type="password" placeholder="sk-••••••••••••" autocomplete="off">
          <button id="toggleKey" class="icon-btn input-action" type="button" aria-label="显示密钥" title="显示/隐藏密钥">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.5"/></svg>
          </button>
        </div>
      </div>

      <label class="remember-row"><input id="rememberKey" type="checkbox"> 在此浏览器中记住 API Key</label>

      <div class="divider"></div>
      <p class="section-title">Model</p>
      <div class="field">
        <label for="modelSelect">模型选择 <span>Model</span></label>
        <select id="modelSelect">
          <option value="gpt-5.5">gpt-5.5</option>
          <option value="gpt-5.6-luna">gpt-5.6-luna</option>
          <option value="gpt-5.6-sol">gpt-5.6-sol</option>
          <option value="gpt-5.6-terra">gpt-5.6-terra</option>
        </select>
      </div>
      <div id="customModelField" class="field" hidden>
        <label for="customModel">模型 ID</label>
        <input id="customModel" type="text" placeholder="输入接口支持的模型 ID">
      </div>

      <div class="status-card">
        <div class="status-line"><span class="status-dot"></span><strong>本地模式</strong></div>
        <p>对话历史保存在 localStorage。API Key 仅在勾选“记住”后保存，请勿在公共设备上启用。</p>
      </div>
    </aside>

    <section class="chat-shell">
      <header class="topbar">
        <div class="topbar-title">
          <h2>CHAT LAB / 模型对话</h2>
          <p id="connectionSummary">尚未开始对话</p>
        </div>
        <div class="topbar-actions">
          <button id="mobileConfigBtn" class="icon-btn mobile-config" type="button" title="接口配置" aria-label="接口配置">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
          </button>
          <button id="clearBtn" class="clear-btn" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"/></svg>
            <span>清空记录</span>
          </button>
        </div>
      </header>

      <div id="messages" class="messages" role="log" aria-live="polite"></div>

      <footer class="composer-area">
        <div id="imagePreviewList" class="image-preview-list" aria-label="待发送图片"></div>
        <div class="composer">
          <input id="imageInput" type="file" accept="image/*" multiple hidden>
          <button id="uploadBtn" class="icon-btn upload-btn" type="button" title="上传图片" aria-label="上传图片">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m21 11.5-8.4 8.4a6 6 0 0 1-8.5-8.5l8-8a4 4 0 0 1 5.7 5.7l-8 8a2 2 0 1 1-2.8-2.8l7.4-7.4"/></svg>
          </button>
          <textarea id="messageInput" rows="1" placeholder="输入消息，Enter 发送，Shift + Enter 换行…" aria-label="消息内容"></textarea>
          <button id="sendBtn" class="send-btn" type="button">
            <span>发送</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="m4 4 17 8-17 8 3-8-3-8Z"/><path d="M7 12h14"/></svg>
          </button>

          <span id="feedback">可发送文字和图片</span>
          <span>内容由模型生成，请注意核实</span>

  </main>

  <dialog id="configDialog">
    <div class="dialog-head">
      <h3>接口配置</h3>
      <button id="closeDialogBtn" class="icon-btn" type="button" aria-label="关闭">×</button>
    </div>
    <form id="mobileConfigForm" class="dialog-body" method="dialog">
      <div class="field"><label for="mobileBaseUrl">接口地址</label><input id="mobileBaseUrl" type="url" required></div>
      <div class="field"><label for="mobileApiKey">API Key</label><input id="mobileApiKey" type="password" placeholder="sk-••••••••••••"></div>
      <div class="field"><label for="mobileModel">模型</label><select id="mobileModel" required><option value="gpt-5.5">gpt-5.5</option><option value="gpt-5.6-luna">gpt-5.6-luna</option><option value="gpt-5.6-sol">gpt-5.6-sol</option><option value="gpt-5.6-terra">gpt-5.6-terra</option></select></div>
      <label class="remember-row"><input id="mobileRememberKey" type="checkbox"> 在此浏览器中记住 API Key</label>
      <div class="dialog-actions"><button id="cancelDialogBtn" class="secondary-btn" type="button">取消</button><button class="primary-btn" value="save">保存配置</button></div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status"></div>

  <script>
    (() => {
      'use strict';

      const STORAGE = {
        messages: 'local-chat.messages.v1',
        settings: 'local-chat.settings.v1'
      };
      const MAX_IMAGES = 4;
      const MAX_IMAGE_BYTES = 2 * 1024 * 1024;

      const $ = (id) => document.getElementById(id);
      const els = {
        baseUrl: $('baseUrl'), apiKey: $('apiKey'), rememberKey: $('rememberKey'),
        toggleKey: $('toggleKey'), modelSelect: $('modelSelect'), customModel: $('customModel'),
        customModelField: $('customModelField'), messages: $('messages'), messageInput: $('messageInput'),
        sendBtn: $('sendBtn'), clearBtn: $('clearBtn'), imageInput: $('imageInput'), uploadBtn: $('uploadBtn'),
        imagePreviewList: $('imagePreviewList'), feedback: $('feedback'), connectionSummary: $('connectionSummary'),
        toast: $('toast'), configDialog: $('configDialog'), mobileConfigBtn: $('mobileConfigBtn'),
        closeDialogBtn: $('closeDialogBtn'), cancelDialogBtn: $('cancelDialogBtn'), mobileConfigForm: $('mobileConfigForm'),
        mobileBaseUrl: $('mobileBaseUrl'), mobileApiKey: $('mobileApiKey'), mobileModel: $('mobileModel'),
        mobileRememberKey: $('mobileRememberKey')
      };

      let messages = [];
      let pendingImages = [];
      let activeController = null;
      let toastTimer = null;

      function safeParse(value, fallback) {
        try { return JSON.parse(value) ?? fallback; } catch { return fallback; }
      }

      function getSelectedModel() {
        return els.modelSelect.value === '__custom__' ? els.customModel.value.trim() : els.modelSelect.value;
      }

      function saveSettings() {
        const settings = {
          baseUrl: els.baseUrl.value.trim(),
          model: getSelectedModel(),
          rememberKey: els.rememberKey.checked,
          apiKey: els.rememberKey.checked ? els.apiKey.value.trim() : ''
        };
        localStorage.setItem(STORAGE.settings, JSON.stringify(settings));
        updateSummary();
      }

      function loadSettings() {
        const settings = safeParse(localStorage.getItem(STORAGE.settings), {});
        if (settings.baseUrl) els.baseUrl.value = settings.baseUrl;
        if (settings.rememberKey && settings.apiKey) {
          els.rememberKey.checked = true;
          els.apiKey.value = settings.apiKey;
        }
        if (settings.model) setModel(settings.model);
      }

      function setModel(model) {
        const allowedModels = ['gpt-5.5', 'gpt-5.6-luna', 'gpt-5.6-sol', 'gpt-5.6-terra'];
        els.modelSelect.value = allowedModels.includes(model) ? model : 'gpt-5.5';
        els.customModelField.hidden = true;
      }

      function saveMessages() {
        try {
          localStorage.setItem(STORAGE.messages, JSON.stringify(messages));
        } catch (error) {
          showFeedback('历史记录过大，图片可能无法保存到本地', 'error');
          showToast('localStorage 空间不足；可清空记录或发送更小的图片。');
        }
      }

      function loadMessages() {
        const saved = safeParse(localStorage.getItem(STORAGE.messages), []);
        messages = Array.isArray(saved) ? saved.filter((m) => m && ['user', 'assistant'].includes(m.role)) : [];
      }

      function formatTime(iso) {
        const date = new Date(iso);
        if (Number.isNaN(date.getTime())) return '';
        return new Intl.DateTimeFormat('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false }).format(date);
      }

      function escapeHtml(value) {
        const entities = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
        return String(value).replace(/[&<>"']/g, (char) => entities[char]);
      }

      function safeMarkdownUrl(value, type = 'link') {
        const url = String(value).trim();
        if (type === 'image') {
          if (/^https?:\/\//i.test(url)) return url;
          if (/^data:image\/(?:png|jpe?g|gif|webp);base64,/i.test(url)) return url;
          return '';
        }
        return /^(?:https?:\/\/|mailto:|#)/i.test(url) ? url : '';
      }

      function splitTableRow(line) {
        let value = line.trim();
        if (value.startsWith('|')) value = value.slice(1);
        if (value.endsWith('|')) value = value.slice(0, -1);
        const cells = [];
        let cell = '';
        for (let index = 0; index < value.length; index += 1) {
          if (value[index] === '\\' && value[index + 1] === '|') {
            cell += '|';
            index += 1;
          } else if (value[index] === '|') {
            cells.push(cell.trim());
            cell = '';
          } else {
            cell += value[index];
          }
        }
        cells.push(cell.trim());
        return cells;
      }

      function renderMarkdown(markdown) {
        let source = String(markdown || '').replace(/\r\n?/g, '\n');
        const tokens = [];
        const keep = (html) => {
          const token = '\uE100' + tokens.length + '\uE101';
          tokens.push(html);
          return token;
        };

        source = source.replace(/\x60{3}([^\r\n\x60]*)\n([\s\S]*?)\x60{3}/g, (_, language, code) => {
          const safeLanguage = language.trim().split(/\s+/)[0].replace(/[^\w-]/g, '').slice(0, 32);
          return keep('<pre data-language="' + escapeHtml(safeLanguage) + '"><code>' + escapeHtml(code.replace(/\n$/, '')) + '</code></pre>');
        });

        source = source.replace(/\x60([^\x60\n]+)\x60/g, (_, code) => keep('<code>' + escapeHtml(code) + '</code>'));

        source = source.replace(/!\[([^\]]*)\]\((\S+?)(?:\s+["'][^"']*["'])?\)/g, (_, alt, rawUrl) => {
          const url = safeMarkdownUrl(rawUrl, 'image');
          if (!url) return alt || '图片';
          return keep('<img class="markdown-image" src="' + escapeHtml(url) + '" alt="' + escapeHtml(alt) + '" loading="lazy">');
        });

        source = source.replace(/\[([^\]]+)\]\((\S+?)(?:\s+["'][^"']*["'])?\)/g, (_, label, rawUrl) => {
          const url = safeMarkdownUrl(rawUrl);
          if (!url) return label;
          return keep('<a href="' + escapeHtml(url) + '" target="_blank" rel="noopener noreferrer">' + escapeHtml(label) + '</a>');
        });

        source = escapeHtml(source);

        const inline = (value) => value
          .replace(/~~([^~\n]+)~~/g, '<del>$1</del>')
          .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
          .replace(/__([^_\n]+)__/g, '<strong>$1</strong>')
          .replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>')
          .replace(/(^|[^_])_([^_\n]+)_(?!_)/g, '$1<em>$2</em>');

        const lines = source.split('\n');
        const output = [];
        const isDivider = (line) => /^\s*\|?(?:\s*:?-{3,}:?\s*\|)+\s*:?-{3,}:?\s*\|?\s*$/.test(line);
        const isTokenLine = (line) => /^\uE100\d+\uE101$/.test(line.trim());
        const isBlockStart = (index) => {
          const line = lines[index] || '';
          if (!line.trim()) return true;
          if (/^#{1,6}\s+/.test(line)) return true;
          if (/^\s*(?:-{3,}|\*{3,}|_{3,})\s*$/.test(line)) return true;
          if (/^\s*>/.test(line)) return true;
          if (/^\s*(?:[-+*]|\d+[.)])\s+/.test(line)) return true;
          if (isTokenLine(line)) return true;
          return index + 1 < lines.length && isDivider(lines[index + 1]);
        };

        let index = 0;
        while (index < lines.length) {
          const line = lines[index];
          if (!line.trim()) {
            index += 1;
            continue;
          }

          if (isTokenLine(line)) {
            output.push(line.trim());
            index += 1;
            continue;
          }

          const heading = line.match(/^(#{1,6})\s+(.+)$/);
          if (heading) {
            const level = heading[1].length;
            output.push('<h' + level + '>' + inline(heading[2].trim()) + '</h' + level + '>');
            index += 1;
            continue;
          }

          if (/^\s*(?:-{3,}|\*{3,}|_{3,})\s*$/.test(line)) {
            output.push('<hr>');
            index += 1;
            continue;
          }

          if (index + 1 < lines.length && isDivider(lines[index + 1])) {
            const headers = splitTableRow(line);
            const alignmentCells = splitTableRow(lines[index + 1]);
            const alignments = alignmentCells.map((cell) => {
              const trimmed = cell.trim();
              if (/^:-+:$/.test(trimmed)) return 'center';
              if (/^-+:$/.test(trimmed)) return 'right';
              return 'left';
            });
            index += 2;
            const rows = [];
            while (index < lines.length && lines[index].trim() && lines[index].includes('|')) {
              rows.push(splitTableRow(lines[index]));
              index += 1;
            }
            const head = headers.map((cell, cellIndex) => '<th style="text-align:' + (alignments[cellIndex] || 'left') + '">' + inline(cell) + '</th>').join('');
            const body = rows.map((row) => '<tr>' + headers.map((_, cellIndex) => '<td style="text-align:' + (alignments[cellIndex] || 'left') + '">' + inline(row[cellIndex] || '') + '</td>').join('') + '</tr>').join('');
            output.push('<div class="table-wrap"><table><thead><tr>' + head + '</tr></thead><tbody>' + body + '</tbody></table></div>');
            continue;
          }

          if (/^\s*>/.test(line)) {
            const quote = [];
            while (index < lines.length && /^\s*>/.test(lines[index])) {
              quote.push(lines[index].replace(/^\s*>\s?/, ''));
              index += 1;
            }
            output.push('<blockquote>' + inline(quote.join('<br>')) + '</blockquote>');
            continue;
          }

          const listMatch = line.match(/^\s*([-+*]|\d+[.)])\s+(.+)$/);
          if (listMatch) {
            const ordered = /^\d/.test(listMatch[1]);
            const items = [];
            let hasTasks = false;
            while (index < lines.length) {
              const match = lines[index].match(/^\s*([-+*]|\d+[.)])\s+(.+)$/);
              if (!match || /^\d/.test(match[1]) !== ordered) break;
              let item = match[2];
              const task = item.match(/^\[([ xX])\]\s+(.+)$/);
              if (task) {
                hasTasks = true;
                item = '<input type="checkbox" disabled' + (task[1].toLowerCase() === 'x' ? ' checked' : '') + '> ' + inline(task[2]);
              } else {
                item = inline(item);
              }
              items.push('<li>' + item + '</li>');
              index += 1;
            }
            const tag = ordered ? 'ol' : 'ul';
            output.push('<' + tag + (hasTasks ? ' class="task-list"' : '') + '>' + items.join('') + '</' + tag + '>');
            continue;
          }

          const paragraph = [line];
          index += 1;
          while (index < lines.length && lines[index].trim() && !isBlockStart(index)) {
            paragraph.push(lines[index]);
            index += 1;
          }
          output.push('<p>' + inline(paragraph.join('<br>')) + '</p>');
        }

        return output.join('').replace(/\uE100(\d+)\uE101/g, (_, tokenIndex) => tokens[Number(tokenIndex)] || '');
      }

      function createSvgAvatar(role) {
        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        avatar.textContent = role === 'user' ? 'YOU' : 'AI';
        return avatar;
      }

      function renderMessages(scroll = false) {
        els.messages.replaceChildren();
        if (!messages.length) {
          const empty = document.createElement('div');
          empty.className = 'empty-state';
          empty.innerHTML = '<div class="empty-inner"><div class="empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 5.5h16v11H8l-4 3v-14Z"/><path d="M8 10h8M8 13h5"/></svg></div><h3>开始一段新对话</h3><p>在左侧填写接口配置，然后输入消息。<br>你的对话历史只保存在当前浏览器中。</p></div>';
          els.messages.append(empty);
        } else {
          messages.forEach((message) => els.messages.append(createMessageElement(message)));
        }
        if (scroll) requestAnimationFrame(() => { els.messages.scrollTop = els.messages.scrollHeight; });
        updateSummary();
      }

      function createMessageElement(message) {
        const row = document.createElement('article');
        row.className = `message-row ${message.role}`;
        row.append(createSvgAvatar(message.role));

        const stack = document.createElement('div');
        stack.className = 'message-stack';
        const bubble = document.createElement('div');
        bubble.className = 'bubble';

        const images = document.createElement('div');
        images.className = 'message-images';
        (message.images || []).forEach((src) => {
          if (typeof src !== 'string' || !src.startsWith('data:image/')) return;
          const img = document.createElement('img');
          img.src = src;
          img.alt = '消息图片';
          img.loading = 'lazy';
          img.addEventListener('click', () => window.open(src, '_blank', 'noopener,noreferrer'));
          images.append(img);
        });
        bubble.append(images);

        if (message.pending) {
          const typing = document.createElement('div');
          typing.className = 'typing';
          typing.setAttribute('aria-label', '模型正在回复');
          typing.innerHTML = '<span></span><span></span><span></span>';
          bubble.append(typing);
        } else {
          const text = document.createElement('div');
          text.className = 'message-text markdown-body';
          text.innerHTML = renderMarkdown(message.text || (message.images?.length ? '' : '（空消息）'));
          bubble.append(text);
        }

        const meta = document.createElement('div');
        meta.className = 'message-meta';
        meta.textContent = `${message.role === 'user' ? '你' : '模型'} · ${formatTime(message.time)}`;
        stack.append(bubble, meta);
        row.append(stack);
        return row;
      }

      function updateSummary() {
        const model = getSelectedModel() || '未选择模型';
        els.connectionSummary.textContent = messages.length ? `${model} · ${messages.length} 条消息` : `${model} · 尚未开始对话`;
      }

      function showFeedback(text, type = '') {
        els.feedback.textContent = text;
        els.feedback.className = type;
      }

      function showToast(text) {
        clearTimeout(toastTimer);
        els.toast.textContent = text;
        els.toast.classList.add('show');
        toastTimer = setTimeout(() => els.toast.classList.remove('show'), 2800);
      }

      function autoResizeTextarea() {
        els.messageInput.style.height = 'auto';
        els.messageInput.style.height = `${Math.min(els.messageInput.scrollHeight, 160)}px`;
      }

      function renderPendingImages() {
        els.imagePreviewList.replaceChildren();
        pendingImages.forEach((item, index) => {
          const wrap = document.createElement('div');
          wrap.className = 'preview-item';
          const img = document.createElement('img');
          img.src = item.dataUrl;
          img.alt = item.name;
          const remove = document.createElement('button');
          remove.className = 'remove-image';
          remove.type = 'button';
          remove.textContent = '×';
          remove.title = `移除 ${item.name}`;
          remove.addEventListener('click', () => {
            pendingImages.splice(index, 1);
            renderPendingImages();
          });
          wrap.append(img, remove);
          els.imagePreviewList.append(wrap);
        });
      }

      function fileToDataUrl(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = () => reject(new Error(`无法读取 ${file.name}`));
          reader.readAsDataURL(file);
        });
      }

      async function addImages(files) {
        const imageFiles = [...files].filter((file) => file.type.startsWith('image/'));
        if (!imageFiles.length) return showToast('请选择图片文件。');
        const remaining = MAX_IMAGES - pendingImages.length;
        if (remaining <= 0) return showToast(`每条消息最多添加 ${MAX_IMAGES} 张图片。`);

        for (const file of imageFiles.slice(0, remaining)) {
          if (file.size > MAX_IMAGE_BYTES) {
            showToast(`${file.name} 超过 2 MB，未添加。`);
            continue;
          }
          try { pendingImages.push({ name: file.name, dataUrl: await fileToDataUrl(file) }); }
          catch (error) { showToast(error.message); }
        }
        renderPendingImages();
        els.imageInput.value = '';
      }

      function endpointFrom(baseUrl) {
        const clean = baseUrl.trim().replace(/\/+$/, '');
        if (/\/chat\/completions$/i.test(clean)) return clean;
        return `${clean}/chat/completions`;
      }

      function toApiMessages(items) {
        return items.filter((item) => !item.pending).map((item) => {
          const images = Array.isArray(item.images) ? item.images : [];
          if (!images.length) return { role: item.role, content: item.text || '' };
          const content = [];
          if (item.text) content.push({ type: 'text', text: item.text });
          images.forEach((url) => content.push({ type: 'image_url', image_url: { url } }));
          return { role: item.role, content };
        });
      }

      function extractResponse(data) {
        const content = data?.choices?.[0]?.message?.content;
        if (typeof content === 'string') return { text: content, images: [] };
        if (Array.isArray(content)) {
          const texts = [];
          const images = [];
          content.forEach((part) => {
            if (typeof part === 'string') texts.push(part);
            else if (part?.type === 'text' && part.text) texts.push(part.text);
            else if (part?.type === 'image_url') {
              const url = typeof part.image_url === 'string' ? part.image_url : part.image_url?.url;
              if (url) images.push(url);
            }
          });
          return { text: texts.join('\n'), images };
        }
        if (typeof data?.output_text === 'string') return { text: data.output_text, images: [] };
        throw new Error('接口已响应，但未找到可显示的回复内容。');
      }

      async function sendMessage() {
        if (activeController) {
          activeController.abort();
          return;
        }

        const text = els.messageInput.value.trim();
        const baseUrl = els.baseUrl.value.trim();
        const apiKey = els.apiKey.value.trim();
        const model = getSelectedModel();

        if (!baseUrl) {
          showFeedback('请填写接口地址', 'error');
          if (window.matchMedia('(max-width: 820px)').matches) openMobileConfig();
          return;
        }
        if (!apiKey) {
          showFeedback('请填写 API Key', 'error');
          if (window.matchMedia('(max-width: 820px)').matches) openMobileConfig();
          return;
        }
        if (!model) {
          showFeedback('请选择模型', 'error');
          if (window.matchMedia('(max-width: 820px)').matches) openMobileConfig();
          return;
        }
        if (!text && !pendingImages.length) return showFeedback('请输入消息或添加图片', 'error');

        try { new URL(baseUrl); } catch { return showFeedback('接口地址格式不正确', 'error'); }

        const userMessage = {
          id: crypto.randomUUID?.() || String(Date.now()),
          role: 'user', text, images: pendingImages.map((item) => item.dataUrl), time: new Date().toISOString()
        };
        messages.push(userMessage);
        pendingImages = [];
        els.messageInput.value = '';
        autoResizeTextarea();
        renderPendingImages();
        saveSettings();
        saveMessages();

        const pendingMessage = { id: `pending-${Date.now()}`, role: 'assistant', text: '', images: [], time: new Date().toISOString(), pending: true };
        messages.push(pendingMessage);
        renderMessages(true);

        activeController = new AbortController();
        els.sendBtn.querySelector('span').textContent = '停止';
        els.sendBtn.title = '停止生成';
        showFeedback('正在等待模型回复…');

        try {
          const response = await fetch(endpointFrom(baseUrl), {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
            body: JSON.stringify({ model, messages: toApiMessages(messages), stream: false }),
            signal: activeController.signal
          });

          const raw = await response.text();
          let data;
          try { data = raw ? JSON.parse(raw) : {}; }
          catch { throw new Error(`接口返回了非 JSON 内容（HTTP ${response.status}）。`); }

          if (!response.ok) {
            const detail = data?.error?.message || data?.message || raw.slice(0, 300) || response.statusText;
            throw new Error(`请求失败（HTTP ${response.status}）：${detail}`);
          }

          const result = extractResponse(data);
          Object.assign(pendingMessage, result, { pending: false, time: new Date().toISOString() });
          showFeedback('回复已完成', 'ok');
        } catch (error) {
          const index = messages.indexOf(pendingMessage);
          if (index !== -1) messages.splice(index, 1);
          if (error.name === 'AbortError') {
            showFeedback('已停止本次请求');
          } else {
            showFeedback(error.message, 'error');
            showToast(error.message.includes('Failed to fetch')
              ? '连接失败：请检查接口地址、网络以及服务端 CORS 设置。'
              : error.message);
          }
        } finally {
          activeController = null;
          els.sendBtn.querySelector('span').textContent = '发送';
          els.sendBtn.title = '';
          saveMessages();
          renderMessages(true);
          els.messageInput.focus();
        }
      }

      function clearHistory() {
        if (!messages.length) return showToast('当前没有对话记录。');
        if (!window.confirm('确定清空全部对话记录吗？此操作无法撤销。')) return;
        if (activeController) activeController.abort();
        messages = [];
        localStorage.removeItem(STORAGE.messages);
        renderMessages();
        showFeedback('对话记录已清空', 'ok');
      }

      function openMobileConfig() {
        els.mobileBaseUrl.value = els.baseUrl.value;
        els.mobileApiKey.value = els.apiKey.value;
        els.mobileModel.value = getSelectedModel();
        els.mobileRememberKey.checked = els.rememberKey.checked;
        if (!els.configDialog.open) els.configDialog.showModal();
      }

      els.modelSelect.addEventListener('change', () => {
        els.customModelField.hidden = els.modelSelect.value !== '__custom__';
        if (!els.customModelField.hidden) els.customModel.focus();
        saveSettings();
      });
      els.customModel.addEventListener('change', saveSettings);
      els.baseUrl.addEventListener('change', saveSettings);
      els.rememberKey.addEventListener('change', saveSettings);
      els.apiKey.addEventListener('change', saveSettings);
      els.toggleKey.addEventListener('click', () => {
        const visible = els.apiKey.type === 'text';
        els.apiKey.type = visible ? 'password' : 'text';
        els.toggleKey.setAttribute('aria-label', visible ? '显示密钥' : '隐藏密钥');
      });

      els.uploadBtn.addEventListener('click', () => els.imageInput.click());
      els.imageInput.addEventListener('change', () => addImages(els.imageInput.files));
      els.sendBtn.addEventListener('click', sendMessage);
      els.clearBtn.addEventListener('click', clearHistory);
      els.messageInput.addEventListener('input', autoResizeTextarea);
      els.messageInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) {
          event.preventDefault();
          sendMessage();
        }
      });

      els.mobileConfigBtn.addEventListener('click', openMobileConfig);
      els.closeDialogBtn.addEventListener('click', () => els.configDialog.close());
      els.cancelDialogBtn.addEventListener('click', () => els.configDialog.close());
      els.configDialog.addEventListener('click', (event) => {
        if (event.target !== els.configDialog) return;
        const rect = els.configDialog.getBoundingClientRect();
        const inside = event.clientX >= rect.left && event.clientX <= rect.right
          && event.clientY >= rect.top && event.clientY <= rect.bottom;
        if (!inside) els.configDialog.close();
      });
      els.mobileConfigForm.addEventListener('submit', (event) => {
        event.preventDefault();
        els.baseUrl.value = els.mobileBaseUrl.value.trim();
        els.apiKey.value = els.mobileApiKey.value.trim();
        els.rememberKey.checked = els.mobileRememberKey.checked;
        setModel(els.mobileModel.value.trim());
        saveSettings();
        els.configDialog.close();
        showToast('接口配置已保存。');
      });

      window.addEventListener('storage', (event) => {
        if (event.key === STORAGE.messages) { loadMessages(); renderMessages(true); }
      });

      loadSettings();
      loadMessages();
      renderMessages();
      autoResizeTextarea();
    })();
  </script>
</body>
</html>
