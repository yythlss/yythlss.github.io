<!doctype html><meta charset="utf-8">
<body style="background:#fff8e6;margin:20px;font-family:monospace">
<div id="row" style="display:flex;gap:18px;flex-wrap:wrap"></div>
<script src="../sprites.js"></script>
<script>
var names=['bFarmer','bRobin','bClint','bPierre','bHarvey','bWizard','bLewis','bMaru','bPenny','bCaroline','bAbigail'];
var row=document.getElementById('row');
names.forEach(function(n){
  var d=document.createElement('div');
  d.setAttribute('data-sprite',n); d.setAttribute('data-scale','3');
  row.appendChild(d);
  var t=document.createElement('div'); t.textContent=n; t.style.fontSize='11px';
  row.appendChild(t);
});
mountSprites(document);
</script>
